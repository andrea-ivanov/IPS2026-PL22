name: test-all
on:
  push:
    branches-ignore:
      - 'dependabot/**' # evita duplicar ejecuciones en dependabot
    tags-ignore:
      - 'v*' # evita reejecutar sobre commits ya etiquetados
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Select Java Version
        uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build and run all tests
        run: xvfb-run -a mvn verify -Dfile.encoding=UTF-8 -Dmaven.test.failure.ignore=true -U --no-transfer-progress

      - name: Publish surefire test report
        if: always()
        uses: mikepenz/action-junit-report@v6.5.0
        with:
          check_name: test-report
          report_paths: 'target/*-reports/TEST-*.xml'
          fail_on_failure: 'true'
 
      - if: always()
        name: Publish html test reports to an artifact
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-files
          path: |
             target/site/
             target/surefire-reports/
             target/reports/surefire.html
